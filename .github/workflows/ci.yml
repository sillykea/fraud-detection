name: ci
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: fraud_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 2s --health-retries 20
    env:
      FRAUD_TEST_DATABASE_URL: postgres://app:app@localhost:5432/fraud_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.26" }
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Verify module checksums
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Test (against Postgres, with the race detector)
        run: go test -race -count=1 -coverprofile=cover.out ./...
      - name: Coverage
        run: go tool cover -func=cover.out | tail -1

  # Detection quality is a test like any other: two months of labelled
  # traffic, and the build fails if recall or false positives regress.
  detection-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: fraud
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/fraud?sslmode=disable&pool_max_conns=20
      FRAUD_API_TOKEN: ci-fraud-token-0123456789abcdef01234567
      LEDGER_WEBHOOK_SECRET: ci-webhook-secret-0123456789abcdef0123
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.26" }
      - name: Start the service
        run: |
          go build -o fraud ./cmd/fraud
          ./fraud > fraud.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8090/readyz && break; sleep 1; done
      - name: Replay labelled traffic and gate on recall and false positives
        run: go run ./cmd/simulate -seed 1 -min-recall 0.9 -max-fpr 0.005 -report report.md
      - name: Publish the report
        if: always()
        run: test -f report.md && cat report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Service log on failure
        if: failure()
        run: tail -50 fraud.log

  # The real thing: payments-ledger posting signed events through its outbox.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.26" }
      - name: Start Postgres, the ledger and the fraud service
        run: docker compose up --build -d --wait
      - name: Scripted fraud through the ledger
        run: go run ./cmd/simulate -mode ledger -token demo-fraud-token-0123456789abcdef0123 -ledger-token demo-token-change-me-0123456789abcdef
      - name: Every event delivered, none rejected
        run: |
          for i in $(seq 1 30); do
            pending=$(docker compose exec -T postgres psql -U app -d ledger -tAc "select count(*) from outbox where published_at is null")
            [ "$pending" = "0" ] && break; sleep 1
          done
          total=$(docker compose exec -T postgres psql -U app -d ledger -tAc "select count(*) from outbox")
          seen=$(docker compose exec -T postgres psql -U app -d fraud -tAc "select count(*) from processed_events")
          rejected=$(docker compose exec -T postgres psql -U app -d fraud -tAc "select count(*) from rejected_events")
          echo "outbox=$total pending=$pending processed=$seen rejected=$rejected"
          [ "$pending" = "0" ] && [ "$seen" = "$total" ] && [ "$rejected" = "0" ]
      - name: Metrics
        run: curl -s localhost:8090/metrics | grep -E '^fraud_(events|alerts|rule_hits)_total'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 100

  image:
    needs: [test, detection-quality, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: VERSION=${{ github.ref_name }}
          tags: ghcr.io/sillykea/fraud-detection:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
